<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11142b">
  <title>ليلة التحدي | Party Box</title>
  <link rel="stylesheet" href="styles.css">
  <script src="supabase-config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <main id="app" class="app-shell">
    <header id="room-tools" class="room-tools" hidden></header>
    <header id="scoreboard" class="scoreboard" hidden></header>
    <section id="screen" class="screen" aria-live="polite"></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
